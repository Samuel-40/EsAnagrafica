<html>
<head>
<title>Dati utente</title>
</head>
<body>

<h2>Inserisci i tuoi dati</h2>

Nome: <input type="text" id="nome"> <br><br>
Cognome: <input type="text" id="cognome"> <br><br>
Indirizzo: <input type="text" id="indirizzo"> <br><br>

<button onclick="mostraDati()">Mostra</button>

<div id="risultato" style="
    position:absolute;
    right:50px;
    top:50px;
    border:1px solid black;
    padding:10px;
    width:200px;">
    <h3>Dati inseriti:</h3>
</div>

<script>
function mostraDati() {
    var nome = document.getElementById("nome").value;
    var cognome = document.getElementById("cognome").value;
    var indirizzo = document.getElementById("indirizzo").value;

   <script type="text/javascript">

   function controlla() {     

        for(i=0;i<document.getElementsByName("colori").length;i++) {

          if(document.getElementsByName("colori")[i].checked){

           document.getElementById("risp").innerHTML = document.getElementsByName("colori")[i].value
           
          }

        }

    }

   </script>
 <body>

    <div style="margin-left:100px;">

        <input type="radio" name="colori" value="rosso">Rosso<br>

        <input type="radio" name="colori" value="verde">Verde<br>

        <input type="radio" name="colori" value="bianco">Bianco<br>

        <input type="button" onclick="controlla();" value="Invia">

    </div>

   <p id="risp"></p>
  </body>

    document.getElementById("risultato").innerHTML =
        "<h3>Dati inseriti:</h3>" +
        "Nome: " + nome + "<br>" +
        "Cognome: " + cognome + "<br>" +
        "Indirizzo: " + indirizzo;
}
</script>

</body>
</html>
